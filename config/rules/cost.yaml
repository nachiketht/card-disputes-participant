# Public list price, USD per million tokens.
# A listed model is "estimate from list price".
# A model that is not listed is "no price configured for <model>".
# Do not guess a number.
# claude-haiku-4-5: input 1.00, output 5.00. Public list price. Checked 2026-10-26.
# claude-haiku-5-5: input 0.10, output 0.50 for prompts up to 100,000 tokens.
# Public list price, checked 2026-10-27 (list prices effective 2026-10-07).
# Prompts over 100K tokens are 0.50 / 2.50 and are not modelled; our prompts are far below 100K.
# On Azure this is billed through Foundry consumption units, so the invoice may differ from list.
# Source: https://platform.claude.com/docs/en/about-claude/pricing.md
# gpt-6-luna: input 0.10, output 0.50. Azure Global Standard, short context.
# List price from Azure Global Standard. Checked 2026-10-27.
# Cached input is 0.01 and is not modelled.
# Long-context rates (0.20 input / 0.75 output) and Data Zone US (+10%) / EU (+20%) are not modelled; our prompts are far below the long-context threshold.
# The status is list price from Azure Global Standard. The Azure invoice may differ from list.
# The stored id is not rewritten. A space in the id is matched to this row only for the price.
# Source: https://azure.microsoft.com/en-us/blog/gpt-6-astra-sol-and-luna-for-production-agents-in-microsoft-foundry/
models:
  claude-haiku-4-5:
    input_per_million: 1.00
    output_per_million: 5.00
  claude-haiku-5-5:
    input_per_million: 0.10
    output_per_million: 0.50
  gpt-6-luna:
    input_per_million: 0.10
    output_per_million: 0.50
  # Clef models do not charge for output tokens.
  clef-flash:
    input_per_million: 0.038
    output_per_million: 0.00
compute:
  status: "estimate, unmeasured"

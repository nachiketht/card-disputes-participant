# Public list price, USD per million tokens.
# A listed model is "estimate from list price".
# A model that is not listed is "no price configured for <model>".
# Do not guess a number.
# claude-haiku-4-5 is not listed. A call with that id has no price.
# The stored id is not rewritten. A space in an id is matched to its row only for the price.
#
# LLM_MODEL gpt-6-luna is the main model.
# LLM_FALLBACK_MODEL claude-haiku-5-5 is asked once when that call cannot be used.
# JEV_MODEL jev-latest is the ranker. CLEF_MODEL clef-flash is the ranker fallback.
models:
  # Fallback. Public list price, checked 2026-10-27 (list prices effective 2026-10-07).
  # Input 0.10, output 0.50 for prompts up to 100,000 tokens.
  # Prompts over 100K tokens are 0.50 / 2.50 and are not modelled; our prompts are far below 100K.
  # On Azure this is billed through Foundry consumption units, so the invoice may differ from list.
  # Source: https://platform.claude.com/docs/en/about-claude/pricing.md
  claude-haiku-5-5:
    input_per_million: 0.10
    output_per_million: 0.50
  # Main model. Azure Global Standard, short context. Checked 2026-10-27.
  # Input 0.10, output 0.50. Cached input is 0.01 and is not modelled.
  # Long-context rates (0.20 input / 0.75 output) and Data Zone US (+10%) / EU (+20%) are not modelled; our prompts are far below the long-context threshold.
  # The Azure invoice may differ from list.
  # Source: Azure Global Standard list, checked 2026-10-27.
  gpt-6-luna:
    input_per_million: 0.10
    output_per_million: 0.50
  # Ranker fallback. Input 0.038. Output tokens are not charged.
  clef-flash:
    input_per_million: 0.038
    output_per_million: 0.00
  # Ranker. Input 0.042. Output tokens are not charged.
  jev-latest:
    input_per_million: 0.042
    output_per_million: 0.00
compute:
  status: "estimate, unmeasured"

# Leak check applied to drafts, logs, traces, audit output, and saved reports.
# The built-in checks below stay on. Add extra_markers or extra_patterns to extend them.
enabled:
  - markers
  - card
  - iban
  - account
  - email
  - phone
# Literal markers. A trailing run of letters, digits, "_" or "-" is included.
markers:
  - SYNTHETIC-PRIVATE
  - private_token
  - CUST-
# card uses a Luhn check on 13-19 digits, with optional single spaces or dashes.
# A 16 or 32 character hex id (span, trace, parent) is not treated as a card.
card: luhn
patterns:
  email: '(?<![A-Za-z0-9._%+\-])[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
  phone: '(?<!\d)(?:\+\d{8,15}|\+\d{1,3}(?:[\s.\-]\d{2,4}){2,3}|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b)(?!\d)'
  account: '(?i)\b(?:account|acct|a/c)\b[\s:#\-]*\d{8,17}\b'
  iban: '\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b'
extra_markers: []
extra_patterns: []

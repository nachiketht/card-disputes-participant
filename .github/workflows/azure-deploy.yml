# Unverified until a person runs this workflow. Push does not start it.
# A new revision clears the temporary ledger and the temporary drafts.
name: azure-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: require the deploy sign-in
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TENANT_ID_VAR: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SUBSCRIPTION_ID_VAR: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "Set AZURE_DEPLOY_CLIENT_ID. The push job uses a different client id." >&2
            exit 1
          fi
          if [ -z "$AZURE_TENANT_ID" ] && [ -z "$AZURE_TENANT_ID_VAR" ]; then
            echo "Set AZURE_TENANT_ID." >&2
            exit 1
          fi
          if [ -z "$AZURE_SUBSCRIPTION_ID" ] && [ -z "$AZURE_SUBSCRIPTION_ID_VAR" ]; then
            echo "Set AZURE_SUBSCRIPTION_ID." >&2
            exit 1
          fi
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}
      - name: unverified image update
        run: |
          set -eu
          image="pod3disputes.azurecr.io/card-disputes:${GITHUB_SHA}"
          az acr login --name pod3disputes
          docker build -t "$image" .
          docker push "$image"
          az containerapp update \
            --name card-disputes \
            --resource-group card-disputes-rg \
            --container-name mock \
            --image "$image"
          az containerapp update \
            --name card-disputes \
            --resource-group card-disputes-rg \
            --container-name app \
            --image "$image"
          az containerapp secret list \
            --name card-disputes \
            --resource-group card-disputes-rg \
            --query "[].name" \
            -o tsv
